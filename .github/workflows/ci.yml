name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      # The diagrams and index prose are server components on purpose; a client
      # bundle past this budget almost certainly means something heavy crossed
      # the RSC boundary again. Chunks currently sit around 630KB.
      - name: Enforce client bundle budget
        run: |
          size_kb=$(du -sk .next/static/chunks | cut -f1)
          echo "Client chunks: ${size_kb}KB (budget 1000KB)"
          [ "$size_kb" -lt 1000 ] || { echo "Bundle budget exceeded"; exit 1; }

      # Reuse this build for the test job instead of building twice.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  test:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
